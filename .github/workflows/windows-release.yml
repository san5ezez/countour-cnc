name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag and draft release, such as v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Use a version tag such as v0.2.0.'
          }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false

      - name: Build portable EXE
        shell: pwsh
        run: |
          $testExe = 'dist/Contour-CNC-TEST-' + $env:RELEASE_TAG.Substring(1) + '-x64.exe'
          python packaging/windows/build.py dist/Contour-CNC-x64.exe --test-output $testExe

      - name: Verify Windows startup and editor
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/Contour-CNC-x64.exe').Path
          $version = $env:RELEASE_TAG.Substring(1)
          $testExe = (Resolve-Path "dist/Contour-CNC-TEST-$version-x64.exe").Path
          $cases = @(
            @{ exe = $exe; port = 8765; editor = $false; launch = @('--no-browser') }
            @{ exe = $testExe; port = 8766; editor = $true; launch = @('--no-browser') }
            @{ exe = $exe; port = 18767; editor = $true; launch = @('--no-browser', '--test', '--port', '18767') }
          )
          $processes = @()
          try {
            foreach ($case in $cases) {
              $editor = $case.editor
              $process = Start-Process -FilePath $case.exe -ArgumentList $case.launch -PassThru -NoNewWindow
              $processes += $process
              $base = "http://127.0.0.1:$($case.port)"
              $features = $null
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                if ($process.HasExited) { throw "The EXE exited with code $($process.ExitCode)." }
                try {
                  $features = Invoke-RestMethod "$base/api/features" -TimeoutSec 2
                  break
                } catch {
                  Start-Sleep -Seconds 1
                }
              }
              if ($null -eq $features -or $features.editor -ne $editor -or $features.version -ne $version) {
                throw "Unexpected release or mode at $base."
              }
              $html = (Invoke-WebRequest "$base/").Content
              $mode = if ($editor) { 'test' } else { 'standard' }
              if (!$html.Contains('data-launch-mode="' + $mode + '"')) { throw 'Page mode mismatch.' }
              if (!(Invoke-RestMethod "$base/api/ports").serialAvailable) {
                throw 'The bundled Windows serial library did not load.'
              }
              if ((Invoke-RestMethod "$base/api/file").name -ne 'rosette.nc') {
                throw 'The example G-code is missing.'
              }
              if ($editor) {
                if (!$html.Contains('id="editor-transform"')) { throw 'Editor transform controls are missing.' }
                $payload = @{ source = "G21 G90`nG1 X10 Z-1 F200"; factor = 2 } | ConvertTo-Json
                $result = Invoke-RestMethod "$base/api/scale" -Method Post -ContentType 'application/json' -Headers @{'X-CNC-Panel' = 'local'} -Body $payload
                if ($result.source -notmatch 'X20 Z-1 F200') { throw 'XY scaling failed.' }
                $transform = @{
                  source = "G21 G90`nG0 X1 Y2`nG1 X3 Y2 F200`nM30"
                  factor = 1
                  angle = 90
                  dx = 5
                  dy = 0
                  pivot = @(0, 0)
                } | ConvertTo-Json
                $result = Invoke-RestMethod "$base/api/transform" -Method Post -ContentType 'application/json' -Headers @{'X-CNC-Panel' = 'local'} -Body $transform
                if ($result.source -notmatch 'X3 Y3 F200') { throw 'XY rotation failed.' }
              }
            }
          } finally {
            foreach ($process in $processes) {
              if (!$process.HasExited) { taskkill /T /F /PID $process.Id | Out-Null }
            }
          }

      - name: Upload and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $draft = gh release view "$env:RELEASE_TAG" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'An existing draft release is required.' }
          $digest = (Get-FileHash 'dist/Contour-CNC-x64.exe').Hash.ToLowerInvariant()
          $version = $env:RELEASE_TAG.Substring(1)
          $testFile = "Contour-CNC-TEST-$version-x64.exe"
          $testDigest = (Get-FileHash "dist/$testFile").Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), "$digest  Contour-CNC-x64.exe`n$testDigest  $testFile`n")
          $versioned = "dist/Contour-CNC-$version-x64.exe"
          Copy-Item 'dist/Contour-CNC-x64.exe' $versioned
          gh release upload "$env:RELEASE_TAG" dist/Contour-CNC-x64.exe $versioned "dist/$testFile" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'The release assets could not be uploaded.' }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'The draft release could not be published.' }
